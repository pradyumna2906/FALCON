name: Frontend quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend contracts, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Match frontend/package.json's exact Playwright version. The official image
    # contains browsers and OS dependencies, avoiding apt mirror downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure Git workspace ownership in the container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate backend contract
        run: |
          python -m pip install -e "backend[optimization]"
          python scripts/export-openapi.py --check
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Check generated types
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/generated.d.ts
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build
      - name: Verify preinstalled browser executables
        working-directory: frontend
        run: |
          node -e "if (require('@playwright/test/package.json').version !== '1.63.0') { throw new Error('Update the pinned Playwright image to match the installed package'); }"
          node --input-type=module -e "import { accessSync } from 'node:fs'; import { chromium, firefox, webkit } from '@playwright/test'; for (const browser of [chromium, firefox, webkit]) { accessSync(browser.executablePath()); console.log(browser.name() + ': browser executable available'); }"
      - name: Browser workflow checks
        working-directory: frontend
        run: npm run test:browser
      - name: Browser failure diagnostics (synthetic fixtures only)
        if: failure()
        working-directory: frontend
        run: |
          if [ -d test-results ]; then
            find test-results -name error-context.md -type f -exec cat {} +
          fi
