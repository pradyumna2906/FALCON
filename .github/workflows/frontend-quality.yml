name: Frontend quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend contracts, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate backend contract
        run: |
          python -m pip install -e backend
          python scripts/export-openapi.py --check
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Check generated types
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/generated.d.ts
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build
