name: Backend quality

on:
  pull_request:
    branches: [develop, main]
    paths: ["backend/**", "compose.yaml", ".dockerignore", ".env.example", "scripts/compose-smoke.sh", ".github/workflows/backend-quality.yml"]
  push:
    branches: [develop, main]
    paths: ["backend/**", "compose.yaml", ".dockerignore", ".env.example", "scripts/compose-smoke.sh", ".github/workflows/backend-quality.yml"]

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version-file: .python-version, cache: pip}
      - run: python -m pip install --disable-pip-version-check --no-cache-dir -e "backend[dev]"
      - run: python -m pytest backend/tests/unit

  container-build:
    name: API container build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build api

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: bash scripts/compose-smoke.sh
