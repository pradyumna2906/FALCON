name: Release quality
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: release-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deployment:
    name: TLS deployment and encrypted restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - run: python -m pip install cryptography==50.0.0
      - run: bash scripts/release-smoke.sh
  dependencies:
    name: Production dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
      - run: python -m pip install -e 'backend[forecasting,ml,optimization]' pip-audit==2.9.0
      - run: python -m pip_audit
      - working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
