name: falcon-production

x-runtime: &runtime
  image: ${FALCON_API_IMAGE:-falcon-api:release}
  env_file: ${FALCON_RELEASE_ENV:?Set an absolute path to the private release environment}
  environment:
    FALCON_ENV: production
    FALCON_DB_HOST: postgres
    FALCON_DB_PORT: "5432"
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [private]

services:
  api:
    <<: *runtime
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        FALCON_EXTRAS: forecasting,ml,optimization
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ${FALCON_CLASSIFIER_DIR:?Set the reviewed classifier artifact directory}:/models/classification:ro
  worker:
    <<: *runtime
    command: [python, -m, falcon_api.worker]
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.stat('/tmp/falcon-worker.ready').st_mtime < 120"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 1
    depends_on:
      postgres: {condition: service_healthy}
  migrate:
    <<: *runtime
    profiles: [maintenance]
    command: [alembic, -c, /app/alembic.ini, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    image: ${FALCON_WEB_IMAGE:-falcon-web:release}
    build: ../frontend
    restart: unless-stopped
    ports: ["${FALCON_HTTP_PORT:-80}:8080", "${FALCON_HTTPS_PORT:-443}:8443"]
    volumes:
      - ${FALCON_TLS_DIR:?Set the TLS certificate directory}:/run/tls:ro
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    networks: [private]
    depends_on:
      api: {condition: service_healthy}
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FALCON_DB_NAME:?Set database name}
      POSTGRES_USER: ${FALCON_DB_USER:?Set database user}
      POSTGRES_PASSWORD: ${FALCON_DB_PASSWORD:?Set database password}
    volumes: [postgres_data:/var/lib/postgresql]
    mem_limit: 1g
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, /run/redis/redis.conf]
    volumes:
      - ${FALCON_REDIS_CONFIG:?Set private Redis config path}:/run/redis/redis.conf:ro
      - redis_data:/data
    mem_limit: 256m
    networks: [private]
    healthcheck:
      # NOAUTH still proves the configured Redis process is responding.
      test: [CMD-SHELL, 'redis-cli ping 2>&1 | grep -Eq "PONG|NOAUTH"']
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  private: {}
volumes:
  postgres_data: {}
  redis_data: {}
